# Perfil de produção: PostgreSQL. Ative com SPRING_PROFILES_ACTIVE=prod
# e informe tudo por variáveis de ambiente (sem valores padrão de teste).
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health

potencia.web-url=${WEB_URL}
potencia.sessao.cookie-segura=true
potencia.email.provedor=${EMAIL_PROVEDOR:resend}
potencia.email.remetente=${EMAIL_REMETENTE}
potencia.email.resend-chave=${RESEND_CHAVE}
# Sem valor padrão: sem gateway, a assinatura responde que ainda não abriu;
# sem provedor, as aulas abrem sem vídeo.
potencia.pagamentos.gateway=${PAGAMENTOS_GATEWAY:}
potencia.pagamentos.webhook-token=${PAGAMENTOS_WEBHOOK_TOKEN:}
potencia.asaas.url=${ASAAS_URL:https://api.asaas.com}
potencia.video.provedor=${VIDEO_PROVEDOR:}
potencia.admin.email=${ADMIN_EMAIL:}
potencia.admin.senha-inicial=${ADMIN_SENHA_INICIAL:}
# Sem armazenamento configurado, o envio de arquivos responde que não está disponível.
# Disco local ("local" + ARMAZENAMENTO_PASTA) só serve com volume persistente e uma instância.
potencia.armazenamento.provedor=${ARMAZENAMENTO_PROVEDOR:}
potencia.armazenamento.pasta=${ARMAZENAMENTO_PASTA:dados/arquivos}
potencia.arquivos.segredo=${ARQUIVOS_SEGREDO}
potencia.revalidar.segredo=${REVALIDAR_SEGREDO}
potencia.google.client-id=${GOOGLE_CLIENT_ID:}
potencia.google.client-secret=${GOOGLE_CLIENT_SECRET:}
potencia.privacidade.contato=${CONTATO_PRIVACIDADE:}
potencia.dev.emails=false
