spring.application.name=potencia-api
# Acentos certos no console do Windows.
logging.charset.console=UTF-8

# Local: banco H2 em memória que imita o PostgreSQL. Recriado a cada partida,
# com os cursos e os planos das migrações do Flyway.
# Produção: ative o perfil "prod" (ver application-prod.properties).
# DB_CLOSE_DELAY=-1: o banco em memória vive enquanto a API roda (sem isso, some
# quando o pool fecha todas as conexões, por exemplo depois de o computador dormir).
spring.datasource.url=jdbc:h2:mem:potencia;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Local: migrações + currículo de exemplo (db/exemplos). Produção só usa db/migration.
spring.flyway.locations=classpath:db/migration,classpath:db/exemplos

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Sessões: tabelas criadas pelo Flyway (V5). 12 h sem uso; 30 dias com "Lembrar de mim".
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=12h
# Só confia em X-Forwarded-For vindo de rede interna (o Next, que faz o proxy).
server.forward-headers-strategy=native
# Não há usuários em memória: o login é do módulo de contas.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# PORT é a variável que Fly.io, Render e Railway usam.
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,modulith

# Endereço do site (vai nos links dos e-mails).
potencia.web-url=${WEB_URL:http://localhost:3000}
potencia.sessao.cookie-segura=${SESSAO_COOKIE_SEGURA:false}

# E-mail: "log" imprime no console (desenvolvimento); "resend" envia de verdade.
potencia.email.provedor=${EMAIL_PROVEDOR:log}
potencia.email.remetente=${EMAIL_REMETENTE:PotencIA <nao-responda@potencia.local>}
potencia.email.resend-chave=${RESEND_CHAVE:}

# Pagamentos: "falso" aprova na hora (só local). Vídeo: "exemplo" toca uma amostra.
potencia.pagamentos.gateway=${PAGAMENTOS_GATEWAY:falso}
# Token que o gateway manda no cabeçalho asaas-access-token do webhook (/api/webhooks/{gateway}).
# Valor de TESTE, só para o ambiente local.
potencia.pagamentos.webhook-token=${PAGAMENTOS_WEBHOOK_TOKEN:dev-webhook-9fK2pQ7xLm4sT8vB1nC6zR3w}
# Asaas (PAGAMENTOS_GATEWAY=asaas): sandbox por padrão; chave da conta em ASAAS_CHAVE.
potencia.asaas.url=${ASAAS_URL:https://api-sandbox.asaas.com}
potencia.asaas.chave=${ASAAS_CHAVE:}
potencia.asaas.formas=${ASAAS_FORMAS:CREDIT_CARD,PIX}
potencia.asaas.link-assinatura=${ASAAS_LINK_ASSINATURA:}
potencia.video.provedor=${VIDEO_PROVEDOR:exemplo}

# Arquivos enviados pelo painel (capas, fotos, materiais, vídeos): "local" guarda em disco.
potencia.armazenamento.provedor=${ARMAZENAMENTO_PROVEDOR:local}
potencia.armazenamento.pasta=${ARMAZENAMENTO_PASTA:dados/arquivos}
# Assina as URLs de envio e de arquivos privados. Vazio: um aleatório por partida (só local).
potencia.arquivos.segredo=${ARQUIVOS_SEGREDO:}

# Avisa o site (POST /api/revalidar) quando o catálogo muda. O mesmo valor fica em
# REVALIDAR_SEGREDO no web/.env.local. Valor de TESTE, só para o ambiente local.
potencia.revalidar.segredo=${REVALIDAR_SEGREDO:dev-revalidar-7Qm2xL9c}

# Admin criado na inicialização se não houver nenhum (troca de senha obrigatória
# no primeiro acesso). Valores de TESTE, só para o ambiente local.
potencia.admin.email=${ADMIN_EMAIL:admin@potencia.local}
potencia.admin.senha-inicial=${ADMIN_SENHA_INICIAL:dev-N2MzpBKA01F2pi5h}

# Login com Google (Google Cloud > Credenciais > ID do cliente OAuth "Aplicativo da Web").
# URI de redirecionamento autorizado: WEB_URL + /api/auth/google/retorno.
# Vazio: o botão "Continuar com o Google" não aparece.
potencia.google.client-id=${GOOGLE_CLIENT_ID:}
potencia.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Canal de privacidade (encarregado/DPO), citado no arquivo de "Baixar meus dados".
potencia.privacidade.contato=${CONTATO_PRIVACIDADE:}

# Só no ambiente local: GET /api/dev/emails?para= devolve os últimos e-mails "enviados"
# (o provedor "log" guarda em memória). Usado pelos testes de ponta a ponta.
potencia.dev.emails=${DEV_EMAILS:true}
